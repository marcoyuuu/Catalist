<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Órdenes de Productos</title>
    <link rel="icon" href="Assets/logo.png" type="image/x-icon" />
    <!-- Agregar referencia a Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <!-- Agregar referencia a jQuery y Popper.js necesarios para Bootstrap -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <!-- Agregar referencia a Bootstrap JS -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- Include the global script with the logout function -->
    <script src="scripts.js"></script>
    <script>
      // Función para cargar componentes
      function loadComponent(file, elementId) {
        fetch(file)
          .then((response) => response.text())
          .then((data) => {
            document.getElementById(elementId).innerHTML = data;
          });
      }
      // Cargar los componentes una vez que el DOM esté listo
      document.addEventListener('DOMContentLoaded', () => {
        loadComponent('navbar.html', 'navbar-placeholder');
      });
    </script>
    <style>
      body {
          background-color: #363636;
          color: white;
      }

      .navbar {
          background-color: #363636;
      }

      .navbar .navbar-nav .nav-link {
          color: white;
          margin-right: 15px;
      }

      .navbar .navbar-nav .nav-link:hover {
          color: #ccc;
      }

      .navbar-brand img {
          margin-right: 10px;
      }

      .navbar-nav {
          width: 100%;
          justify-content: space-around;
      }

      .navbar .navbar-nav .nav-item {
          margin-left: 10px;
      }

      .container {
          background-color: #363636;
          color: white;
          padding: 20px;
          border-radius: 5px;
      }

      footer {
          background-color: #363636;
          color: white;
          text-align: center;
          padding: 20px;
      }
  </style>
  </head>

  <body>
    <!-- Carga del componente de navegación -->
    <div id="navbar-placeholder"></div>

    <div class="container mt-5">
      <h1 class="mb-4 text-center">Gestión de Órdenes de Compra</h1>
      <form id="purchase-order-form">
        <div class="mb-3">
          <label for="order-number" class="form-label">Número de Orden *</label>
          <input type="text" class="form-control" id="order-number" required />
        </div>
        <div class="mb-3">
          <label for="supplier" class="form-label">Proveedor *</label>
          <input type="text" class="form-control" id="supplier" required />
        </div>
        <div class="mb-3">
          <label for="order-date" class="form-label">Fecha de la Orden *</label>
          <input type="date" class="form-control" id="order-date" required />
        </div>
        <div class="mb-3">
          <label for="expected-delivery-date" class="form-label"
            >Fecha de Entrega Esperada *</label
          >
          <input
            type="date"
            class="form-control"
            id="expected-delivery-date"
            required
          />
        </div>
        <div class="mb-3">
          <label for="order-status" class="form-label"
            >Estado de la Orden *</label
          >
          <select class="form-select" id="order-status" required>
            <option value="">Seleccione el estado</option>
            <option value="pendiente">Pendiente</option>
            <option value="en_proceso">En Proceso</option>
            <option value="enviado">Enviado</option>
            <option value="entregado">Entregado</option>
            <option value="cancelado">Cancelado</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="order-notes" class="form-label">Notas</label>
          <textarea class="form-control" id="order-notes" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </form>
    </div>

    <script>
      document
        .getElementById('purchase-order-form')
        .addEventListener('submit', (event) => {
          event.preventDefault();

          const orderNumber = document.getElementById('order-number').value;
          const supplier = document.getElementById('supplier').value;
          const orderDate = document.getElementById('order-date').value;
          const expectedDeliveryDate = document.getElementById(
            'expected-delivery-date',
          ).value;
          const orderStatus = document.getElementById('order-status').value;
          const orderNotes = document.getElementById('order-notes').value;

          const orderData = {
            orderNumber: orderNumber,
            supplier: supplier,
            orderDate: orderDate,
            expectedDeliveryDate: expectedDeliveryDate,
            orderStatus: orderStatus,
            orderNotes: orderNotes,
            type: 'orden_compra',
          };

          fetch('/clientes', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(orderData),
          })
            .then((response) => response.json())
            .then((data) => {
              console.log(data);
              // Handle success, e.g., show a message or reset the form
              if (data.message === 'Orden de compra creada con éxito') {
                alert('Orden de compra creada con éxito');
              } else {
                alert('Orden de compra creada con éxito');
              }
              document.getElementById('purchase-order-form').reset();
            })
            .catch((error) => {
              console.error('Error:', error);
              // Handle error, e.g., show an error message
              alert(
                'Error al crear orden de compra. Por favor, intente nuevamente',
              );
            });
        });
    </script>

    <footer
      style="
        background-color: #363636;
        color: white;
        text-align: center;
        padding: 20px;
      "
    >
      Catalist © 2023 All rights reserved
    </footer>
  </body>
</html>
