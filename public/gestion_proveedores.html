<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Proveedores</title>
    <link rel="icon" href="Assets/logo.png" type="image/x-icon">
    <!-- Agregar referencia a Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <!-- Agregar referencia a jQuery y Popper.js necesarios para Bootstrap -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <!-- Agregar referencia a Bootstrap JS -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- Include the global script with the logout function -->
    <script src="scripts.js"></script>
    <script>
      // Función para cargar componentes
      function loadComponent(file, elementId) {
        fetch(file)
          .then((response) => response.text())
          .then((data) => {
            document.getElementById(elementId).innerHTML = data;
          });
      }
      // Cargar los componentes una vez que el DOM esté listo
      document.addEventListener('DOMContentLoaded', () => {
        loadComponent('navbar.html', 'navbar-placeholder');
      });
    </script>
    <style>
      body {
          background-color: #363636;
          color: white;
      }

      .navbar {
          background-color: #363636;
      }

      .navbar .navbar-nav .nav-link {
          color: white;
          margin-right: 15px;
      }

      .navbar .navbar-nav .nav-link:hover {
          color: #ccc;
      }

      .navbar-brand img {
          margin-right: 10px;
      }

      .navbar-nav {
          width: 100%;
          justify-content: space-around;
      }

      .navbar .navbar-nav .nav-item {
          margin-left: 10px;
      }

      .container {
          background-color: #363636;
          color: white;
          padding: 20px;
          border-radius: 5px;
      }

      footer {
          background-color: #363636;
          color: white;
          text-align: center;
          padding: 20px;
      }
  </style>
  </head>

  <body>
    <!-- Carga del componente de navegación -->
    <div id="navbar-placeholder"></div>

    <div class="container mt-5">
      <h1 class="mb-4 text-center">Gestión de Proveedores</h1>
      <form id="supplier-form">
        <div class="mb-3">
          <label for="supplier-name" class="form-label"
            >Nombre del Proveedor *</label
          >
          <input type="text" class="form-control" id="supplier-name" required />
        </div>
        <div class="mb-3">
          <label for="supplier-email" class="form-label"
            >Correo Electrónico *</label
          >
          <input
            type="email"
            class="form-control"
            id="supplier-email"
            required
          />
        </div>
        <div class="mb-3">
          <label for="supplier-phone" class="form-label">Teléfono *</label>
          <input type="tel" class="form-control" id="supplier-phone" required />
        </div>
        <div class="mb-3">
          <label for="supplier-address" class="form-label">Dirección *</label>
          <input
            type="text"
            class="form-control"
            id="supplier-address"
            required
          />
        </div>
        <div class="mb-3">
          <label for="supplier-company" class="form-label">Empresa</label>
          <input type="text" class="form-control" id="supplier-company" />
        </div>
        <div class="mb-3">
          <label for="supplier-notes" class="form-label">Notas</label>
          <textarea
            class="form-control"
            id="supplier-notes"
            rows="3"
          ></textarea>
        </div>
        <div class="d-flex justify-content-center mb-4">
          <button id="submit" class="btn" style="background-color: #f5c7f7">
            Guardar
          </button>
        </div>
      </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
      var firebaseConfig = {
        apiKey: 'AIzaSyBVa3E_FjHgT2tdby-5bRieK_pJTyJ3njs',
        authDomain: 'catalist-a076a.firebaseapp.com',
        projectId: 'catalist-a076a',
        storageBucket: 'catalist-a076a.appspot.com',
        messagingSenderId: '693759856140',
        appId: '1:693759856140:web:ec4abb7b93674edc3a6829',
        measurementId: 'G-MQH3EE6FP8',
      };
      firebase.initializeApp(firebaseConfig);

      var db = firebase.firestore();

      const form = document.querySelector('#supplier-form');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        db.collection('proveedores')
          .add({
            nombre: form['supplier-name'].value,
            email: form['supplier-email'].value,
            telefono: form['supplier-phone'].value,
            direccion: form['supplier-address'].value,
            empresa: form['supplier-company'].value,
            notas: form['supplier-notes'].value,
          })
          .then(function () {
            alert('¡Proveedor guardado exitosamente!');
            // Clear form fields after submission
            form.reset();
          })
          .catch(function (error) {
            alert('¡Error guardando proveedor: ', error);
          });
      });
    </script>

    <footer
      style="
        background-color: #363636;
        color: white;
        text-align: center;
        padding: 20px;
      "
    >
      Catalist © 2023 All rights reserved
    </footer>
  </body>
</html>
