<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>
    <link rel="icon" href="Assets/logo.png" type="image/x-icon">
    <!-- Agregar referencia a Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Agregar referencia a jQuery y Popper.js necesarios para Bootstrap -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <!-- Agregar referencia a Bootstrap JS -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- Include the global script with the logout function -->
    <script src="scripts.js"></script>
    <script>
        // Función para cargar componentes
        function loadComponent(file, elementId) {
            fetch(file)
                .then(response => response.text())
                .then(data => {
                    document.getElementById(elementId).innerHTML = data;
                });
        }
        // Cargar los componentes una vez que el DOM esté listo
        document.addEventListener('DOMContentLoaded', () => {
            loadComponent('navbar.html', 'navbar-placeholder');
        });
    </script>
    <style>
        body {
            background-color: #363636;
            color: white;
        }

        .navbar {
            background-color: #363636;
        }

        .navbar .navbar-nav .nav-link {
            color: white;
            margin-right: 15px;
        }

        .navbar .navbar-nav .nav-link:hover {
            color: #ccc;
        }

        .navbar-brand img {
            margin-right: 10px;
        }

        .navbar-nav {
            width: 100%;
            justify-content: space-around;
        }

        .navbar .navbar-nav .nav-item {
            margin-left: 10px;
        }

        .container {
            background-color: #363636;
            color: white;
            padding: 20px;
            border-radius: 5px;
        }

        footer {
            background-color: #363636;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- Carga del componente de navegación -->
    <div id="navbar-placeholder"></div>

    </header>

    <div class="container mt-5">
        <h1 class="mb-4 text-center">Gestión de Clientes y sus Compras</h1>
        <form id="client-form">
            <div class="mb-3">
                <label for="client-name" class="form-label">Nombre del Cliente *</label>
                <input type="text" class="form-control" id="client-name" name="clientName" required>
            </div>
            <div class="mb-3">
                <label for="client-email" class="form-label">Correo Electrónico *</label>
                <input type="email" class="form-control" id="client-email" required>
            </div>
            <div class="mb-3">
                <label for="client-phone" class="form-label">Teléfono *</label>
                <input type="tel" class="form-control" id="client-phone" required>
            </div>
            <div class="mb-3">
                <label for="client-address" class="form-label">Dirección *</label>
                <input type="text" class="form-control" id="client-address" required>
            </div>
            <div class="mb-3">
                <label for="product-name" class="form-label">Nombre de producto *</label>
                <select id="product-name" class="form-control" required>
                    <option value="">Seleccione un producto</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="product-quantity" class="form-label">Cantidad de producto *</label>
                <input type="text" class="form-control" id="product-quantity" required>
            </div>
            <div class="mb-3">
                <label for="pay_option" class="form-label">Forma de pago *</label>
                <select class="form-select" id="pay_option" required>
                    <option value="">Seleccione una forma de pago</option>
                    <option value="al_contado">Al contado</option>
                    <option value="a_plazos">A plazos</option>
                    <option value="no_pagados">No pagados</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="client-company" class="form-label">Empresa</label>
                <input type="text" class="form-control" id="client-company">
            </div>
            <div class="mb-3">
                <label for="client-notes" class="form-label">Notas</label>
                <textarea class="form-control" id="client-notes" rows="3"></textarea>
            </div>
            <div class="d-flex justify-content-center mb-4">
                <button id="submit" class="btn" style="background-color: #f5c7f7;">Guardar</button>
            </div>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyBVa3E_FjHgT2tdby-5bRieK_pJTyJ3njs",
            authDomain: "catalist-a076a.firebaseapp.com",
            projectId: "catalist-a076a",
            storageBucket: "catalist-a076a.appspot.com",
            messagingSenderId: "693759856140",
            appId: "1:693759856140:web:ec4abb7b93674edc3a6829",
            measurementId: "G-MQH3EE6FP8"
        };
        firebase.initializeApp(firebaseConfig);

        var db = firebase.firestore();

        // Fetch all products
        db.collection('productos').get().then((querySnapshot) => {
            const productNameSelect = document.querySelector('#product-name');
            querySnapshot.forEach((doc) => {
                const productData = doc.data();

                // Create a new option element
                const optionEl = document.createElement('option');
                optionEl.value = productData.nombre; // Use product ID as the value
                optionEl.textContent = productData.nombre; // Use product name as the display text

                // Add the option to the select dropdown
                productNameSelect.appendChild(optionEl);
            });
        });


        const form = document.querySelector('#client-form');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Fetch selected product's data
            const selectedProductId = form['product-name'].value;
            const productDoc = await db.collection('productos').where("nombre", "==", selectedProductId).get();
            const productData = productDoc.docs[0].data();
            const productPrice = productData.precio;

            db.collection('clientes').add({
                nombre: form['client-name'].value,
                email: form['client-email'].value,
                telefono: form['client-phone'].value,
                direccion: form['client-address'].value,
                producto: productData.nombre,
                cantidad: form['product-quantity'].value,
                pago: form['pay_option'].value,
                empresa: form['client-company'].value,
                notas: form['client-notes'].value,
                precio: productPrice // Agregamos el precio del producto aquí
            }).then(function () {
                alert('¡Cliente guardado exitosamente!');
                // Clear form fields after submission
                form.reset();
            }).catch(function (error) {
                alert('¡Error guardando cliente: ', error);
            });
        });
    </script>

    <footer style="background-color: #363636; color: white; text-align: center; padding: 20px;">
        Catalist © 2023 All rights reserved
    </footer>
</body>

</html>
