<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documentación de Catalist</title>
    <link rel="icon" href="Assets/logo.png" type="image/x-icon" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <!-- jQuery and Popper.js for Bootstrap -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- Include the global script with the logout function -->
    <script src="scripts.js"></script>
    <script>
      // Load navbar component
      function loadComponent(file, elementId) {
        fetch(file)
          .then((response) => response.text())
          .then((data) => {
            document.getElementById(elementId).innerHTML = data;
          });
      }
      document.addEventListener('DOMContentLoaded', () => {
        loadComponent('navbar.html', 'navbar-placeholder');
      });
    </script>
    <style>
      body {
          background-color: #363636;
          color: white;
      }

      .navbar {
          background-color: #363636;
      }

      .navbar .navbar-nav .nav-link {
          color: white;
          margin-right: 15px;
      }

      .navbar .navbar-nav .nav-link:hover {
          color: #ccc;
      }

      .navbar-brand img {
          margin-right: 10px;
      }

      .navbar-nav {
          width: 100%;
          justify-content: space-around;
      }

      .navbar .navbar-nav .nav-item {
          margin-left: 10px;
      }

      .container {
          background-color: #363636;
          color: white;
          padding: 20px;
          border-radius: 5px;
      }

      footer {
          background-color: #363636;
          color: white;
          text-align: center;
          padding: 20px;
      }
  </style>
  </head>
  <body>
    <!-- Navbar placeholder -->
    <div id="navbar-placeholder"></div>

    <div class="container mt-5">
      <h1 class="mb-4 text-center">Documentación de Catalist</h1>

      <!-- PDF Viewer -->
      <div class="embed-responsive embed-responsive-16by9 mb-4">
        <iframe
          class="embed-responsive-item"
          src="Assets/Informe_Catalist.pdf"
          width="100%"
          height="600"
          style="border: none"
          allowfullscreen
        ></iframe>
      </div>

      <!-- Download and GitHub Links -->
      <div class="text-center">
        <a
          href="Assets/Informe_Catalist.pdf"
          download
          class="btn btn-primary mb-3"
          >Descargar PDF</a
        >
        <a
          href="https://github.com/marcoyuuu/Catalist"
          target="_blank"
          class="btn btn-secondary mb-3"
          >Ver en GitHub</a
        >
      </div>
    </div>

    <footer class="bg-dark text-white text-center py-3">
      Catalist © 2023 All rights reserved
    </footer>
  </body>
</html>
